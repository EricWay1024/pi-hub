# Template: replace hub.example.com and certificate paths with your own domain.
# The backend/tunnel endpoint must bind only to loopback, never 0.0.0.0.
map $http_upgrade $pi_hub_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.example.com;
    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    location = /agent { return 404; }
    # Install deploy/unavailable.html here on the proxy host (not the sleeping
    # backend). This also covers first-time visitors with no cached app shell.
    error_page 502 503 504 =503 /pi-hub-unavailable.html;
    location = /pi-hub-unavailable.html {
        internal;
        alias /var/www/pi-hub/unavailable.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }
    location / {
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_pass http://127.0.0.1:7433;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pi_hub_connection;
        # Hub WebSocket heartbeats run every 30s; keep dead upstream reads bounded.
        proxy_read_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;
    location /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://$host$request_uri; }
}
