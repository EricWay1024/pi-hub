<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Workspace unavailable · Pi Hub</title>
  <style>
    :root { font: 16px/1.6 system-ui, sans-serif; color: #253630; background: #f6f6f1; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; }
    main { max-width: 32rem; padding: 2rem; }
    .logo { font: 4rem Georgia, serif; color: #244c3b; }
    h1 { font: 2rem Georgia, serif; }
    button { font: inherit; cursor: pointer; background: #244c3b; color: white; border: 0; border-radius: .6rem; padding: .65rem 1rem; }
  </style>
</head>
<body><main>
  <span class="logo" aria-hidden="true">π</span>
  <h1>Workspace unavailable</h1>
  <p role="alert">Can’t reach Pi Hub on your machine. Make sure the machine is awake, Pi Hub is running, and any VPN or tunnel is connected.</p>
  <p>Your agents and files remain on your machine. This page cannot confirm whether agents are still running.</p>
  <form action="/" method="get"><button type="submit">↻ Refresh</button></form>
</main></body>
</html>
